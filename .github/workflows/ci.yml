name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: pytest

      - name: Smoke-test the CLI against a fixture
        run: |
          set +e
          aws-cloudtrail-audit --from-json tests/fixtures/neglected.json \
            --fail-on logging-stopped
          code=$?
          set -e
          test "$code" -eq 1
          aws-cloudtrail-audit --from-json tests/fixtures/well-configured.json
